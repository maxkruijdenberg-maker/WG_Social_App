name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:win
      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup' }
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          & $compiler "/DAppVersion=$version" scripts/windows-setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Could not compile the Windows installer' }
      - name: Verify Windows shortcuts and startup window
        shell: pwsh
        run: |
          $installer = Start-Process -FilePath dist/WG-Social-Studio-Setup.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($installer.ExitCode -ne 0) {
            throw "Installer failed with exit code $($installer.ExitCode)"
          }
          $shell = New-Object -ComObject WScript.Shell
          $targets = foreach ($folder in 'DesktopDirectory', 'Programs') {
            $link = Join-Path ([Environment]::GetFolderPath($folder)) 'WG Social Studio.lnk'
            if (-not (Test-Path -LiteralPath $link -PathType Leaf)) {
              throw "Missing shortcut $link"
            }
            $shortcut = $shell.CreateShortcut($link)
            $target = $shortcut.TargetPath
            if (-not (Test-Path -LiteralPath $target -PathType Leaf) -or
                (Split-Path -Leaf $target) -ne 'WG Social Studio.exe') {
              throw "Invalid shortcut target for $link"
            }
            $icon = ($shortcut.IconLocation -split ',', 2)[0]
            $expected = Join-Path (Split-Path -Parent $target) 'resources\ui\icon.ico'
            if ($icon -ne $expected -or (Get-FileHash -LiteralPath $icon).Hash -ne (Get-FileHash ui/icon.ico).Hash) {
              throw "Wrong WG shortcut icon for $link"
            }
            $target
          }
          if ($targets[0] -ne $targets[1]) {
            throw 'The shortcuts point to different executables'
          }
          try {
            ./scripts/verify-windows-window.ps1 -Executable $targets[0]
          } catch {
            Write-Output "::error title=Windows startup check::$($_.Exception.Message)"
            throw
          }
      - name: Publish Windows installer and ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/WG-Social-Studio-Setup.exe dist/WG-Social-Studio-Windows.zip --verify-tag --title "WG Social Studio $env:GITHUB_REF_NAME" --notes "Open WG Social Studio Setup om de app met snelkoppelingen te installeren. De uitpakbare ZIP is ook beschikbaar voor Windows x64."
