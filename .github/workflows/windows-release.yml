name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:win
      - name: Publish Windows ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/WG-Social-Studio-Windows.zip --verify-tag --title "WG Social Studio $env:GITHUB_REF_NAME" --notes "Pak de ZIP volledig uit en open WG Social Studio.exe op Windows x64."
